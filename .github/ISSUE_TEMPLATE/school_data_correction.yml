name: School-data correction
description: A school's name, level or location is wrong, or a school is missing.
title: "Correction: "
labels: [school-data]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping keep the directory accurate. Maintainers check every correction against an official source.

        **This issue is public.** Never include learners', parents', staff members' or donors' names or contact details. Don't attach spreadsheets.

        Most school records come from the Department of Basic Education's national masterlist. If the official record is wrong, the lasting fix is with DBE or the provincial department; we'll tell you if that's the case.
  - type: input
    id: emis
    attributes:
      label: EMIS number
      description: The school's 9-digit national EMIS number, if you know it.
      placeholder: "900000001"
  - type: input
    id: school
    attributes:
      label: School as it appears now
      description: The name and place shown in the search, e.g. on https://skolo-saka.github.io/school-search/
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What's wrong
      options:
        - Name
        - Level (primary, high, combined)
        - Town, municipality or province
        - School is missing
        - School has closed or merged
        - Duplicate record
        - Other
    validations:
      required: true
  - type: textarea
    id: correct
    attributes:
      label: Correct information
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: Public official reference
      description: A link to a public government or school source that shows the correct information.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This report contains no personal information about learners, parents, staff or donors.
          required: true
